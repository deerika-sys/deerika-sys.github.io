const data={
readme:{title:'README.txt',sub:'Welcome',heading:'Welcome.',paras:["Welcome! I'm DeErika, a cybersecurity analyst bringing 12 years of healthcare experience into the world of information security.",'Open a folder to explore my story, projects, and toolkit — or use the search bar (or a right-click) to jump straight to what you\u2019re after.','Thanks for stopping by!']},

story:{title:'From Bedside to Security Console',sub:'Personal introduction',heading:'“Why cybersecurity when you’re a nurse?”',photo:true,paras:['I get that question a lot. The short answer: I’m circling back to something I’ve loved since junior high—computers.','After high school, nursing felt like the most practical and attainable path, so I built a career as a registered nurse. I started in 2014 and remain licensed today. In on-site and remote roles, I’ve monitored information, noticed changes, prioritized what needed attention, and escalated concerns to help keep people safe.','Technology never stopped being part of my life. At work, I protected patient information under HIPAA, kept careful records, and dealt with the IV pump that wouldn’t stop beeping, scanner that wouldn’t scan, or clinical device that suddenly had other plans.','Now I have the opportunity to bring those experiences together: my nursing background, my long-standing interest in computers, and the important role technology plays in protecting people and information. I’m bringing that experience to a new focus: cybersecurity.']},
projects:{title:'Projects',sub:'Project directory',heading:'Selected work',text:'I’m building practical experience in vulnerability assessment, incident investigation, and compliance-focused security design. Each project outlines the situation, key findings, response, and outcome.',items:[
{t:'Securing the Everyday: home printer security assessment',meta:'October 2026',g:['Nmap','Nessus Essentials','SNMP'],n:[['Situation','A Canon network printer on a home network had never been checked for security problems.'],['Findings','Nmap and Nessus Essentials turned up a default SNMP community string, a GETBULK reflection finding, and a certificate trust warning.'],['Action','Disabled SNMPv1, configured Nessus to trust the verified printer certificate, and restored printing by adjusting Windows port monitoring.'],['Result','The follow-up scan reported only informational findings.']]},
{t:'Xestric Technologies: simulated Windows Server incident',meta:'October 2026',g:['Windows Event Logs','IIS','SIEM rule design'],n:[['Situation','Users were locked out of accounts and a web application was returning HTTP 503 errors.'],['Findings','Correlating Windows Update, Security, and System logs showed that a failed update triggered repeated authentication attempts and disabled an IIS application pool.'],['Action','Documented the rollback, update reinstallation, and service recovery.'],['Result','Proposed a SIEM rule that links failed logons and lockouts with IIS failures so a recurrence gets flagged early.']]},
{t:'Network vulnerability scan and packet analysis',meta:'WGU coursework · scenario-based',g:['Nmap / Zenmap','Wireshark','CVE research'],n:[['Situation','Given a scan and a packet capture from a lab network, I mapped it and looked for weaknesses.'],['Findings','A star topology with six devices. Nmap fingerprinted three as running an end-of-life Linux 2.6 kernel, one exposed FTP on port 21, and one exposed Windows RPC on port 135. In Wireshark I found web traffic sent in cleartext over HTTP, a TLS 1.2 session, and a malformed packet sent to MySQL port 3306 that could signal a denial-of-service attempt.'],['Action','Researched the related CVEs and recommended patching or replacing unsupported systems, switching FTP to SFTP, layering IDS/IPS and firewall defenses, enforcing HTTPS with HSTS and TLS 1.3, and closing or restricting port 3306.'],['Result','Wrote up each finding with its risk and a specific fix.']]},
{t:'Hospital SASE migration (fictional case study)',meta:'December 2025 · WGU capstone · revised November 2026',g:['Zero trust','Entra ID and MFA','HIPAA technical safeguards','VLAN segmentation'],n:[['Situation','At GoldWorth Health, a fictional health system with about 8,200 employees, malware from a phishing email stole a nurse manager’s session token and hijacked a VPN session that had already passed MFA. An automated “impossible travel” alert stopped it before any data left.'],['Action','Compared Cisco Secure Access, Zscaler, and Palo Alto Prisma Access, then designed a migration to zero trust access with Microsoft Entra ID and MFA. Four goals map to the HIPAA technical safeguards: audit controls, access control and authentication, transmission security, and data integrity. Legacy radiology systems are isolated on VLANs.'],['Result','Delivered a proposal with goals, deliverables, and a timeline, plus a post-implementation report covering testing, rollout, scope changes, and an MFA enrollment policy.'],['Note','This is a simulated scenario, not a real deployment.']]},
{t:'Wireless, mobile, and compliance risk assessment (fictional company)',meta:'WGU coursework · scenario-based',g:['Defense in depth','Mobile device management','GLBA','BYOD'],n:[['Situation','A financial company with an aging headquarters, a firewall as its only network defense, no IT staff to manage devices, and sales reps traveling most of the time with company laptops, tablets, and phones.'],['Findings','Weak physical security, a wireless access point whose signal could leak outside, no layered defenses, unmanaged mobile devices that could be lost or stolen, and exposure under GLBA and SEC Regulation S-P.'],['Action','Recommended defense in depth with WPA3, segmentation, and IDS/IPS, plus cameras, access control, and a locked network closet. For mobile, I recommended VPN, MFA, a smaller device footprint, mobile device management with remote wipe, and a staff member to run it. I also covered BYOD and mapped the controls to the GLBA safeguards.'],['Result','Wrote a layered risk assessment with prioritized recommendations.']]}]},
toolkit:{title:'Toolkit and Skills',sub:'Tools, techniques, and focus areas',heading:'Toolkit and skills',groups:[['Security operations','Windows and Linux log analysis · Alert triage · Phishing investigation · MITRE ATT&CK · CIA triad'],['Network and vulnerability analysis','Wireshark · Nmap · Nessus · OpenVAS · NetworkMiner · Snort · TCP/IP · DNS · HTTP · SNMP · Firewall configuration'],['SIEM and scripting','Splunk · Elastic Stack · SQL · Python'],['Operating systems and command line','Windows · Linux · Command line · PowerShell · Bash · SSH'],['Identity and compliance','MFA · Zero trust · HIPAA · GLBA · DLP']]},
credentials:{title:'Credentials and Training',sub:'Education, certifications, and ongoing learning',heading:'Credentials and training',groups:[['Certifications','CompTIA A+ · CompTIA Network+ · CompTIA Security+ · CompTIA CySA+ · CompTIA PenTest+ · CompTIA Project+ · ISC2 SSCP · ITIL 4 Foundation · Linux Professional Institute: Linux Foundations'],['Education','B.S., Cybersecurity and Information Assurance, Western Governors University, May 2026 · B.S., Nursing, Valdosta State University, May 2014'],['Training','TryHackMe Pre Security (March 2026) — Offensive and defensive security basics, core networking (LANs, the OSI model, how packets move), how DNS and HTTP deliver the web, and Linux and Windows fundamentals. · TryHackMe Cyber Security 101 (April 2026) — A tour of the full stack: how hardware, operating systems, and networks actually work, plus the CIA triad and the MITRE ATT&CK framework. Hands-on with firewall configuration, SSH, and core web security. · TryHackMe SOC Level 1 (July 2026) — An analyst-focused path covering phishing analysis, network and endpoint monitoring, and malware fundamentals — hands-on with Splunk and Elastic for SIEM triage, Wireshark and NetworkMiner for traffic analysis, and Snort for intrusion detection. · In progress: Cisco Cybersecurity Defense Analyst path · In progress: TryHackMe AI security path']]}
