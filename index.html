function typeIntro(t,i){if(t!==run)return;if(i>=lines.length){document.getElementById('enterline').hidden=false;return}const [label,value,kind]=lines[i];const row=document.createElement('div');row.className='typedline';const ls=document.createElement('span');ls.className='prompt';ls.textContent=label;const val=document.createElement('span');val.className=kind==='v'?'val':'key';row.append(ls,val);typed.append(row);if(calm){val.textContent=value;typeIntro(t,i+1);return}let n=0;const timer=setInterval(()=>{if(t!==run){clearInterval(timer);return}val.textContent=value.slice(0,++n);if(n>=value.length){clearInterval(timer);setTimeout(()=>typeIntro(t,i+1),180)}},25)}

readme:{title:'README.txt',sub:'Welcome',heading:'Welcome.',paras:['I’m DeErika Smith, a cybersecurity analyst who spent 12 years as a registered nurse.','Start with From Bedside to Security Console for the story, then open Projects for hands-on case notes. Everything here is clickable. Use the search bar to find a tool or topic, and right-click anywhere on the desktop for shortcuts.','Thanks for stopping by.']},

story:{title:'From Bedside to Security Console',sub:'Personal introduction',heading:'“Why cybersecurity when you’re a nurse?”',photo:true,paras:['I get that question a lot. The short answer: I’m circling back to something I’ve loved since junior high—computers.','After high school, nursing felt like the most practical and attainable path, so I built a career as a registered nurse. I started in 2014 and remain licensed today. In on-site and remote roles, I’ve monitored information, noticed changes, prioritized what needed attention, and escalated concerns to help keep people safe.','Technology never stopped being part of my life. At work, I protected patient information under HIPAA, kept careful records, and dealt with the IV pump that wouldn’t stop beeping, scanner that wouldn’t scan, or clinical device that suddenly had other plans.','Now I have the opportunity to bring those experiences together: my nursing background, my long-standing interest in computers, and the important role technology plays in protecting people and information. I’m bringing that experience to a new focus: cybersecurity.']},
projects:{title:'Projects',sub:'Project directory',heading:'Selected work',text:'I’m building practical experience in vulnerability assessment, incident investigation, and compliance-focused security design. Each project outlines the situation, key findings, response, and outcome.',items:[
{t:'Securing the Everyday: home printer security assessment',meta:'October 2026',g:['Nmap','Nessus Essentials','SNMP'],n:[['Situation','A Canon network printer on a home network had never been checked for security problems.'],['Findings','Nmap and Nessus Essentials turned up a default SNMP community string, a GETBULK reflection finding, and a certificate trust warning.'],['Action','Disabled SNMPv1, configured Nessus to trust the verified printer certificate, and restored printing by adjusting Windows port monitoring.'],['Result','The follow-up scan reported only informational findings.']]},
{t:'Xestric Technologies: simulated Windows Server incident',meta:'October 2026',g:['Windows Event Logs','IIS','SIEM rule design'],n:[['Situation','Users were locked out of accounts and a web application was returning HTTP 503 errors.'],['Findings','Correlating Windows Update, Security, and System logs showed that a failed update triggered repeated authentication attempts and disabled an IIS application pool.'],['Action','Documented the rollback, update reinstallation, and service recovery.'],['Result','Proposed a SIEM rule that links failed logons and lockouts with IIS failures so a recurrence gets flagged early.']]},
{t:'Network vulnerability scan and packet analysis',meta:'WGU coursework · scenario-based',g:['Nmap / Zenmap','Wireshark','CVE research'],n:[['Situation','Given a scan and a packet capture from a lab network, I mapped it and looked for weaknesses.'],['Findings','A star topology with six devices. Nmap fingerprinted three as running an end-of-life Linux 2.6 kernel, one exposed FTP on port 21, and one exposed Windows RPC on port 135. In Wireshark I found web traffic sent in cleartext over HTTP, a TLS 1.2 session, and a malformed packet sent to MySQL port 3306 that could signal a denial-of-service attempt.'],['Action','Researched the related CVEs and recommended patching or replacing unsupported systems, switching FTP to SFTP, layering IDS/IPS and firewall defenses, enforcing HTTPS with HSTS and TLS 1.3, and closing or restricting port 3306.'],['Result','Wrote up each finding with its risk and a specific fix.']]},
{t:'Hospital SASE migration (fictional case study)',meta:'December 2025 · WGU capstone · revised November 2026',g:['Zero trust','Entra ID and MFA','HIPAA technical safeguards','VLAN segmentation'],n:[['Situation','At GoldWorth Health, a fictional health system with about 8,200 employees, malware from a phishing email stole a nurse manager’s session token and hijacked a VPN session that had already passed MFA. An automated “impossible travel” alert stopped it before any data left.'],['Action','Compared Cisco Secure Access, Zscaler, and Palo Alto Prisma Access, then designed a migration to zero trust access with Microsoft Entra ID and MFA. Four goals map to the HIPAA technical safeguards: audit controls, access control and authentication, transmission security, and data integrity. Legacy radiology systems are isolated on VLANs.'],['Result','Delivered a proposal with goals, deliverables, and a timeline, plus a post-implementation report covering testing, rollout, scope changes, and an MFA enrollment policy.'],['Note','This is a simulated scenario, not a real deployment. <a href="GoldWorth_SASE_Post-Implementation_Report.pdf" target="_blank" rel="noopener">Read the post-implementation report (PDF)</a>']]},
{t:'Wireless, mobile, and compliance risk assessment (fictional company)',meta:'WGU coursework · scenario-based',g:['Defense in depth','Mobile device management','GLBA','BYOD'],n:[['Situation','A financial company with an aging headquarters, a firewall as its only network defense, no IT staff to manage devices, and sales reps traveling most of the time with company laptops, tablets, and phones.'],['Findings','Weak physical security, a wireless access point whose signal could leak outside, no layered defenses, unmanaged mobile devices that could be lost or stolen, and exposure under GLBA and SEC Regulation S-P.'],['Action','Recommended defense in depth with WPA3, segmentation, and IDS/IPS, plus cameras, access control, and a locked network closet. For mobile, I recommended VPN, MFA, a smaller device footprint, mobile device management with remote wipe, and a staff member to run it. I also covered BYOD and mapped the controls to the GLBA safeguards.'],['Result','Wrote a layered risk assessment with prioritized recommendations.']]}]},
toolkit:{title:'Toolkit and Skills',sub:'Tools, techniques, and focus areas',heading:'Toolkit and skills',groups:[['Security operations','Windows and Linux log analysis · Alert triage · Phishing investigation · MITRE ATT&CK'],['Network and vulnerability analysis','Wireshark · Nmap · Nessus · OpenVAS · TCP/IP · DNS · SNMP'],['SIEM and scripting','Splunk · Elastic Stack · SQL · Python'],['Operating systems and command line','Windows · Linux · Command line · PowerShell · Bash'],['Identity and compliance','MFA · Zero trust · HIPAA · GLBA · DLP']]},

else{html=`<div class="eyebrow">${d.sub}</div><h2>${d.heading}</h2>`;if(d.photo)html+='<img class="pic" src="profile.jpg" alt="Portrait of DeErika Smith" onerror="this.remove()">';if(d.text)html+=`<p>${d.text}</p>`;if(d.paras)html+=d.paras.map(p=>`<p>${p}</p>`).join('');if(d.bin)html+='<div class="filelist"><button data-secret><span>secrets.txt<small>Deleted just now</small></span><em>↗</em></button></div>';
if(d.groups)html+='<div class="skillgrid">'+d.groups.map(g=>`<article class="skill"><h3>${g[0]}</h3><div class="chips">${g[1].split(' · ').map(x=>`<span class="chip">${x}</span>`).join('')}</div></article>`).join('')+'</div>';
if(d.items)html+='<div class="filelist">'+d.items.map((p,i)=>`<button data-i="${i}"><span>${p.t}<small>${p.meta}</small></span><em>→</em></button>`).join('')+'</div>'}
content.innerHTML=html;content.scrollTop=0;content.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>showModule('projects',+b.dataset.i));const bk=content.querySelector('[data-back]');if(bk)bk.onclick=()=>showModule('projects');const sc=content.querySelector('[data-secret]');if(sc)sc.onclick=showSecret;win.classList.add('open');veil.classList.add('open');if(!wasOpen)pop();appEl.textContent=d.title;appEl.hidden=false;document.getElementById('close').focus()}

const sIn=document.getElementById('search'),sg=document.getElementById('sugg');let sel=-1,cur=[];
function results(q){const out=[];data.projects.items.forEach((p,i)=>{const t=p.g.find(x=>x.toLowerCase().includes(q));if(p.t.toLowerCase().includes(q)||t||JSON.stringify(p.n).toLowerCase().includes(q))out.push([p.t,'Projects'+(t?' · '+t:''),()=>showModule('projects',i)])});['toolkit','credentials'].forEach(k=>data[k].groups.forEach(g=>g[1].split(' · ').forEach(c=>{if(c.toLowerCase().includes(q))out.push([c,data[k].title,()=>showModule(k)])})));['story','readme','bin'].forEach(k=>{if(JSON.stringify(data[k]).toLowerCase().includes(q))out.push([data[k].title,'Desktop',()=>showModule(k)])});return out.slice(0,7)}
function drawSugg(){const q=sIn.value.trim().toLowerCase();if(!q){sg.hidden=true;cur=[];return}cur=results(q);sel=cur.length?0:-1;sg.innerHTML=cur.length?cur.map((r,i)=>`<button role="option" data-i="${i}" class="${i===sel?'sel':''}">${r[0]}<small>${r[1]}</small></button>`).join(''):'<button disabled>No match<small>Try a tool, skill, or certification</small></button>';sg.hidden=false}
function pick(i){const r=cur[i];if(!r)return;sg.hidden=true;sIn.value='';cur=[];r[2]()}
sIn.addEventListener('input',drawSugg);
sIn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!cur.length)return;e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+cur.length)%cur.length;sg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('sel',i===sel))}else if(e.key==='Enter'){e.preventDefault();pick(Math.max(sel,0))}else if(e.key==='Escape'){sg.hidden=true}});
sg.addEventListener('mousedown',e=>{const b=e.target.closest('button[data-i]');if(b){e.preventDefault();pick(+b.dataset.i)}});
sIn.addEventListener('blur',()=>setTimeout(()=>{sg.hidden=true},120));
</script><script>document.getElementById('linkedin').href='https://www.linkedin.com/in/deerika-smith-2790a9195';document.querySelector('a[href^="mailto:"]').href='mailto:deerika_wms@icloud.com';document.querySelector('.contact a[aria-label="Resume"]').href='DeErika_Smith_-_Cybersecurity_Resume.pdf';</script><script>
